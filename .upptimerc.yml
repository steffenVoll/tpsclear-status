owner: steffenVoll
repo: tpsclear-status

sites:
  - name: Website
    url: https://tpsclear.co.uk
    showAverageResponseTime: false
  - name: API
    url: https://tpsclear.co.uk/api/health
    showAverageResponseTime: false
  - name: HubSpot webhook receiver
    url: https://tpsclear.co.uk/api/webhooks/hubspot
    showAverageResponseTime: false
    expectedStatusCodes:
      - 200
      - 400
      - 401
      - 405

status-website:
  cname: status.tpsclear.co.uk
  name: TPSClear Status
  introTitle: "**TPSClear** service status"
  introMessage: Live status for the TPSClear website, screening API, and HubSpot webhook receiver, checked every five minutes.
  css: >
    form.f.r { display: none !important; }
    .live-status article.graph { background-image: none !important; }
    .live-status article > div { display: none; }
    .live-status article h4 { margin: 0; display: flex; align-items: center; }
    .live-status article h4 a { pointer-events: none; color: inherit !important; }
    article.link a::after { content: none; }
    .live-status article h4::after { margin-left: auto; font-weight: 600; font-size: 0.9rem; }
    .live-status article.up h4::after { content: "Operational"; color: #2f855a; }
    .live-status article.degraded h4::after { content: "Degraded"; color: #b7791f; }
    .live-status article.down h4::after { content: "Down"; color: #c53030; }
  navbar:
    - title: Status
      href: /
    - title: tpsclear.co.uk
      href: https://tpsclear.co.uk

i18n:
  footer: "© 2026 TPSClear &nbsp;|&nbsp; [Terms](https://tpsclear.co.uk/terms) &nbsp;|&nbsp; [Privacy](https://tpsclear.co.uk/privacy) &nbsp;|&nbsp; [Contact](https://tpsclear.co.uk/contact)"
